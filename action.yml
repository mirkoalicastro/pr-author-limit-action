name: PR Author Limit
description: Auto-closes new PRs when the author already has more than N open PRs in the repository.
author: mirkoalicastro
branding:
  icon: git-pull-request
  color: orange

inputs:
  max-open-prs:
    description: Maximum number of open PRs allowed per author. New PRs that exceed this are closed.
    required: false
    default: '5'
  github-token:
    description: Token used to list and close PRs. Needs pull-requests write permission.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Enforce PR author limit
      uses: actions/github-script@v7
      env:
        MAX_OPEN_PRS: ${{ inputs.max-open-prs }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const limit = parseInt(process.env.MAX_OPEN_PRS, 10);
          if (Number.isNaN(limit) || limit < 0) {
            core.setFailed(`Invalid max-open-prs input: ${process.env.MAX_OPEN_PRS}`);
            return;
          }

          if (!context.payload.pull_request) {
            core.setFailed('This action must be triggered by a pull_request or pull_request_target event.');
            return;
          }

          const author = context.payload.pull_request.user.login;
          const prNumber = context.payload.pull_request.number;

          const openPrs = await github.paginate(github.rest.pulls.list, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            per_page: 100,
          });

          const fromAuthor = openPrs.filter(pr => pr.user.login === author);
          core.info(`Author ${author} has ${fromAuthor.length} open PR(s). Limit: ${limit}.`);

          if (fromAuthor.length <= limit) {
            core.info('Within limit, nothing to do.');
            return;
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body: `Auto-closing: @${author} already has more than ${limit} open PR(s). Please close or merge existing ones before opening new PRs.`,
          });

          await github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
            state: 'closed',
          });
